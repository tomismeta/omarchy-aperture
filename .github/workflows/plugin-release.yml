name: Omarchy Aperture Release

on:
  push:
    tags:
      - "omarchy-aperture-v*"

permissions:
  contents: read

concurrency:
  group: omarchy-aperture-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SOURCE_TAG: ${{ github.ref_name }}
      SOURCE_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout signed plugin source tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify protected-main source and authorized signed tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SOURCE_TAG" =~ ^omarchy-aperture-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_REF" = "refs/tags/$SOURCE_TAG"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"

          protected_main=$(gh api "repos/$GITHUB_REPOSITORY/branches/main")
          test "$(jq -r '.protected' <<<"$protected_main")" = "true"
          jq -e '.protection.required_status_checks.contexts | index("release-check") != null' \
            <<<"$protected_main"
          main_ref="refs/remotes/origin/release-main"
          git fetch --no-tags --force origin "refs/heads/main:$main_ref"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$main_ref"
          git show "$main_ref:config/aperture-release-signers" > "$RUNNER_TEMP/plugin-release-signers"
          test -s "$RUNNER_TEMP/plugin-release-signers"

          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_TAG" --jq '.object.sha')
          tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_TAG" --jq '.object.type')
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.object.sha')
          tag_verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.verification.verified')
          test "$tag_type" = "tag"
          test "$tag_commit" = "$SOURCE_COMMIT"
          verification_ref="refs/tags/release-verification/$SOURCE_TAG"
          git fetch --no-tags --force origin "refs/tags/$SOURCE_TAG:$verification_ref"
          test "$(git rev-parse "$verification_ref")" = "$tag_object"
          test "$(git cat-file -t "$verification_ref")" = "tag"
          test "$(git rev-parse "$verification_ref^{}")" = "$SOURCE_COMMIT"
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/plugin-release-signers" \
            verify-tag "$verification_ref"
          test "$tag_verified" = "true"

          version=${SOURCE_TAG#omarchy-aperture-v}
          jq -e --arg version "$version" '
            .schemaVersion == 1 and
            .id == "aperture" and
            .version == $version and
            .kinds == ["service", "bar-widget"] and
            .keepLoaded == true and
            (has("activation") | not)
          ' manifest.json

          release_check_runs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/plugin-release-check.yml/runs?head_sha=$SOURCE_COMMIT&event=push&status=success&per_page=100")
          release_check=$(jq -c --arg commit "$SOURCE_COMMIT" '
            [
              .workflow_runs[]
              | select(
                  .name == "Plugin Release Check" and
                  .path == ".github/workflows/plugin-release-check.yml" and
                  .event == "push" and
                  .conclusion == "success" and
                  .head_branch == "main" and
                  .head_sha == $commit
                )
            ]
            | sort_by(.run_attempt, .id)
            | last // empty
          ' <<<"$release_check_runs")
          test -n "$release_check"
          test "$(jq -r '.head_repository.full_name' <<<"$release_check")" = "$GITHUB_REPOSITORY"
          printf 'PLUGIN_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'ARCHIVE_NAME=omarchy-aperture-%s.tar.gz\n' "$version" >> "$GITHUB_ENV"
          printf 'RELEASE_DIR=%s/plugin-release\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2

      - name: Run complete plugin contract suite
        run: node test/run.mjs

      - name: Verify exact production payload offline
        run: bin/omarchy-aperture-verify-payload --require-production

      - name: Build deterministic curated runtime archive
        run: |
          mkdir -p "$RELEASE_DIR"
          archive_paths=(
            AttentionPeek.qml
            ApertureMark.qml
            Panel.qml
            PanelFocusLogic.js
            PanelPresentationLogic.js
            Service.qml
            WorkerBridgeLogic.js
            WorkerModel.qml
            WorkerOutputLogic.js
            README.md
            LICENSE
            manifest.json
            preview.png
            bin/aperture-attention-engine
            bin/omarchy-aperture-omp
            bin/omarchy-aperture-pre-remove
            bin/omarchy-aperture-verify-payload
            BUILDINFO.json
            config/aperture-release-signers
            config/artifact-policy.json
            evidence/direct-node-22.23.2.json
            evidence/direct-privacy.json
            evidence/direct-transport.json
            evidence/node-22.23.2.json
            evidence/omp-adapter.json
            evidence/omp-only-worker.json
            evidence/omp-runtime-imports.json
            evidence/runtime-imports.json
            fixtures/omp-direct/approval-request.json
            fixtures/omp-direct/completion-event.json
            fixtures/omp-direct/completion-resolved-event.json
            fixtures/omp-direct/failure-event.json
            fixtures/omp-direct/focus-activation.json
            fixtures/omp-direct/focus-registration-direct-terminal.json
            fixtures/omp-direct/focus-registration-tmux.json
            fixtures/omp-direct/focus-registration.json
            fixtures/omp-direct/focus-result.json
            fixtures/omp-direct/input-request.json
            fixtures/omp-direct/snapshot-completion-resolved.json
            fixtures/omp-direct/snapshot-completion.json
            fixtures/omp-direct/snapshot-failure.json
            fixtures/omp-direct/snapshot-now-next.json
            fixtures/omp-direct/snapshot-resolved.json
            integrations/omp/aperture-omp-extension.mjs
            integrations/omp/package.json
            lib/aperture-attention-engine.cjs
            schemas/omp-worker-output.schema.json
            schemas/omp-attention-event.schema.json
            schemas/surface-protocol.schema.json
            schemas/worker-direct-message.schema.json
          )
          git archive \
            --format=tar \
            --prefix="omarchy-aperture-$PLUGIN_VERSION/" \
            "$SOURCE_COMMIT" \
            "${archive_paths[@]}" > "$RELEASE_DIR/${ARCHIVE_NAME%.gz}"
          gzip -n "$RELEASE_DIR/${ARCHIVE_NAME%.gz}"
          archive_sha=$(sha256sum "$RELEASE_DIR/$ARCHIVE_NAME" | cut -d' ' -f1)
          printf '%s  %s\n' "$archive_sha" "$ARCHIVE_NAME" > "$RELEASE_DIR/$ARCHIVE_NAME.sha256"

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.ref_name }}-release
          path: ${{ runner.temp }}/plugin-release
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: omarchy-aperture-release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_TAG: ${{ github.ref_name }}
      SOURCE_COMMIT: ${{ github.sha }}

    steps:
      - name: Download exact release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'RELEASE_DIR=%s/plugin-release\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/plugin-release"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_TAG-release" \
            --dir "$RUNNER_TEMP/plugin-release"

      - name: Verify candidate and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${SOURCE_TAG#omarchy-aperture-v}
          archive_name="omarchy-aperture-$version.tar.gz"
          archive="$RELEASE_DIR/$archive_name"
          checksum="$RELEASE_DIR/$archive_name.sha256"
          test -f "$archive"
          test -f "$checksum"
          test "$(find "$RELEASE_DIR" -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" = 2
          test "$(cat "$checksum")" = "$(sha256sum "$archive" | cut -d' ' -f1)  $archive_name"
          (cd "$RELEASE_DIR" && sha256sum -c "$archive_name.sha256")
          if existing=$(gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable 2>/dev/null); then
            test "$(jq -r '.isDraft' <<<"$existing")" = "true" || {
              echo "published release already exists for $SOURCE_TAG" >&2
              exit 1
            }
            test "$(jq -r '.isImmutable' <<<"$existing")" = "false"
            gh release delete "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Omarchy Aperture $version" \
            --notes "Authenticated Omarchy Aperture plugin archive. Catalog publication remains blocked pending a separate readiness decision." \
            "$archive" \
            "$checksum"
          draft=$(gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable,isPrerelease,tagName,assets)
          jq -e --arg tag "$SOURCE_TAG" --arg archive "$archive_name" '
            .isDraft == true and
            .isImmutable == false and
            .isPrerelease == false and
            .tagName == $tag and
            ([.assets[].name] | sort) ==
              ([$archive, ($archive + ".sha256")] | sort)
          ' <<<"$draft"
          gh release edit "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          published=$(gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable,isPrerelease,tagName,assets)
          jq -e --arg tag "$SOURCE_TAG" --arg archive "$archive_name" '
            .isDraft == false and
            .isImmutable == true and
            .isPrerelease == false and
            .tagName == $tag and
            ([.assets[].name] | sort) ==
              ([$archive, ($archive + ".sha256")] | sort)
          ' <<<"$published"
